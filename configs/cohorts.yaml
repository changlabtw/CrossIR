# Raw input files per cohort.
#
# The KNHANES file order is load-bearing and deliberately not alphabetical. The
# yearly files are concatenated in the order listed here and rows are sorted only
# *within* each file, so this sequence fixes the row order of the combined table
# — which in turn fixes which participants land in the training and the test
# split, because the split shuffles positionally. Changing the order changes the
# split, and therefore every metric downstream.
knhanes_files:
  - hn20_all.sas7bdat
  - hn21_all.sas7bdat
  - hn19_all.sas7bdat

# NHANES survey cycles, by start year. Order is irrelevant here: the NHANES
# reader sorts globally on Release_No before writing, so its output is
# order-independent.
nhanes_years: [1999, 2001, 2003, 2005, 2007, 2009, 2011]
