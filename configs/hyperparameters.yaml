# Tuned hyperparameters.
#
# Found by Bayesian optimisation (15 initial points, 25 iterations, 5-fold
# StratifiedKFold on AUC, with n_estimators capped at 1000 and early stopping after 50
# rounds; the recorded n_estimators is the mean best iteration across folds).
#
# The search is deterministic under the pinned environment, so re-running it
# reproduces these values; notebook 05 carries the entry point for doing so.
# Committing them keeps the search off the default path, which would otherwise add
# minutes to every run for a result that does not change.

cross_ethnic:
  nhanes:
    CatBoost:
      colsample_bylevel: 0.5010369835298214
      learning_rate: 0.013896845303534116
      max_depth: 4
      reg_lambda: 9.816163157195755
      n_estimators: 973
    XGBoost:
      colsample_bylevel: 0.784294196475686
      colsample_bytree: 0.7924409710166989
      gamma: 4.187131517205855
      learning_rate: 0.061852155667780524
      max_depth: 3
      min_child_weight: 15.67270854480409
      reg_alpha: 2.422676201625513
      reg_lambda: 8.821427542339709
      subsample: 0.746467554108627
      n_estimators: 177
    lightGBM:
      colsample_bytree: 0.5148411632771775
      learning_rate: 0.0566698841576856
      max_depth: 3
      min_child_weight: 18.929669742998612
      reg_alpha: 1.4795140398872182
      reg_lambda: 5.575308902460772
      subsample: 0.651155317862736
      n_estimators: 192
  knhanes:
    CatBoost:
      colsample_bylevel: 0.9933601927668863
      learning_rate: 0.03804865336883355
      max_depth: 4
      reg_lambda: 8.30372642360072
      n_estimators: 373
    XGBoost:
      colsample_bylevel: 0.8385091730188209
      colsample_bytree: 0.9908053535597743
      gamma: 4.91489691007307
      learning_rate: 0.019594260681045333
      max_depth: 3
      min_child_weight: 4.22872627755679
      reg_alpha: 8.521213351518023
      reg_lambda: 7.919578249182112
