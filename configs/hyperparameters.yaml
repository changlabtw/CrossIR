# Tuned hyperparameters.
#
# Found by Bayesian optimisation (15 initial points, 25 iterations, 5-fold
# StratifiedKFold on AUC, with n_estimators capped at 1000 and early stopping after 50
# rounds; the recorded n_estimators is the mean best iteration across folds).
#
# Provenance: transcribed from the `best_params` field of each legacy run's
# results_<algorithm>.json, which is the only authoritative record of what the published
# models were trained with. The literals pasted into
# 1_bidirectional_train_model.ipynb cells [5] and [6] are residue from an earlier run and
# were overwritten with None before training -- see docs/audit.md F25. These values are the
# ones behind thesis Table `params1`, whose reg_lambda entry for the NHANES XGBoost model
# is itself mistranscribed (F26); the value below is the one actually used.

cross_ethnic:
  # 20250221201739_V31
  nhanes:
    CatBoost:
      colsample_bylevel: 0.5010369835298214
      learning_rate: 0.013896845303534116
      max_depth: 4
      reg_lambda: 9.816163157195755
      n_estimators: 973
    XGBoost:
      colsample_bylevel: 0.784294196475686
      colsample_bytree: 0.7924409710166989
      gamma: 4.187131517205855
      learning_rate: 0.061852155667780524
      max_depth: 3
      min_child_weight: 15.67270854480409
