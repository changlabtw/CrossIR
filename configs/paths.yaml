# Filesystem locations used by the pipeline.
#
# Every value may be absolute, or relative to the repository root. The defaults
# below assume the standard layout, so a fresh clone needs no edits to run once
# the raw data is in place.
#
# To point the pipeline at data held elsewhere, create `configs/paths.local.yaml`
# with just the keys you want to change. It is git-ignored, it overrides this
# file key by key, and it is the right place for machine-specific absolute paths.

# Raw cohort files. Never written to by any code here. See the Data Availability
# Statement in README.md for how to obtain each cohort.
raw_data_root: data/raw

# Everything the pipeline writes.
processed_root: data/processed
output_root: data/output

# Per-participant DNA methylation tables, one parquet per participant.
#
# This is NOT the raw input. The raw input is an archive of per-sample text files
# that is both restricted-access and no longer on reachable media, so the
# extraction step of stage 08 cannot be re-run; these per-sample tables are the
# earliest reachable input. See README.md.
methylation_samples_root: data/processed/MET

# Locations of the original analysis, used ONLY by src/validate.py to re-run the
# validation gates in the notebooks. They are not needed to run the pipeline, and
# are null here because that project is not distributed. Set them in
# configs/paths.local.yaml to reproduce the gate comparisons.
reference_processed_root: null
reference_results_root: null
reference_output_root: null
